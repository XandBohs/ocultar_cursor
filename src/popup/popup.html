<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="masthead">
        <div class="brand">
          <img src="../icons/icon-32.png" width="32" height="32" alt="">
          <p class="product-name" data-i18n="extensionName"></p>
        </div>
        <h1 data-i18n="authorizedSitesTitle"></h1>
      </header>

      <section class="current-site" aria-labelledby="current-site-title">
        <p id="current-site-title" class="section-label" data-i18n="currentSiteLabel"></p>
        <p id="current-host" class="current-host" data-i18n="checking"></p>
        <button id="add-current" type="button" class="primary-button" data-i18n="addCurrentSite" disabled></button>
      </section>

      <section class="manual-site" aria-labelledby="manual-site-title">
        <p id="manual-site-title" class="section-label" data-i18n="otherSiteLabel"></p>
        <form id="add-form" novalidate>
          <label for="site-input" data-i18n="siteInputLabel"></label>
          <div class="input-row">
            <input
              id="site-input"
              name="site"
              type="text"
              inputmode="url"
              autocomplete="url"
              data-i18n-placeholder="siteInputPlaceholder"
              aria-describedby="input-help"
            >
            <button type="submit" class="compact-button" data-i18n="addButton"></button>
          </div>
          <p id="input-help" class="help-text" data-i18n="inputHelp"></p>
        </form>
      </section>

      <section class="allowed-sites" aria-labelledby="allowed-sites-title">
        <div class="section-heading">
          <p id="allowed-sites-title" class="section-label" data-i18n="listLabel"></p>
          <span id="site-count" class="site-count"></span>
        </div>
        <ol id="site-list" class="site-list"></ol>
        <p id="empty-state" class="empty-state" data-i18n="emptyState"></p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="../lib/hosts.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
